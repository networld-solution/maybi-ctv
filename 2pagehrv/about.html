<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <link rel='stylesheet' href='css/default.css'>
    <link rel='stylesheet' href='css/about.css'>
    <link rel='stylesheet' href='css/about_reponsive.css'>
</head>

<body>
    <section class="slider">
        <div class="slider-wrapper">
            <div class="slider-item">
                <div class="slider-thumb">
                    <picture>
                        <source media="(max-width: 768px)" srcset="public/images/slider-2-mobile.jpg">
                        <img class="slider-img" src="./public/images/slider-2.jpg" alt="Slider 2">
                    </picture>
                </div>
            </div>
            <div class="slider-item">
                <div class="slider-thumb">
                    <picture>
                        <source media="(max-width: 768px)" srcset="public/images/slider-3-mobile.jpg">
                        <img class="slider-img" src="./public/images/slider-3.jpg" alt="Slider 3">
                    </picture>
                </div>
            </div>
            <div class="slider-item">
                <div class="slider-thumb">
                    <picture>
                        <source media="(max-width: 768px)" srcset="public/images/slider-4-mobile.jpg">
                        <img class="slider-img" src="./public/images/slider-4.jpg" alt="Slider 4">
                    </picture>
                </div>
            </div>
            <div class="slider-item">
                <div class="slider-thumb">
                    <picture>
                        <source media="(max-width: 768px)" srcset="public/images/slider-5-mobile.jpg">
                        <img class="slider-img" src="./public/images/slider-5.jpg" alt="Slider 5">
                    </picture>
                </div>
            </div>
        </div>
        
        <!-- Controls -->
        <button class="slider-control slider-control-prev" aria-label="Previous slide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button class="slider-control slider-control-next" aria-label="Next slide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>

        <!-- Dots -->
        <div class="slider-dots">
            <button class="slider-dot active" data-index="0"></button>
            <button class="slider-dot" data-index="1"></button>
            <button class="slider-dot" data-index="2"></button>
            <button class="slider-dot" data-index="3"></button>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="about">
        <div class="container">
            <div class="about-stats">
                <div class="stats-grid">
                    <!-- Stat 1 -->
                    <div class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="stat-icon" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>
                        <span class="stat-number">2018</span>
                        <span class="stat-label">Năm thành lập</span>
                    </div>
                    <!-- Stat 2 -->
                    <div class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="stat-icon" aria-hidden="true"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"></path></svg>
                        <span class="stat-number">1000+</span>
                        <span class="stat-label">Mẫu thiết kế</span>
                    </div>
                    <!-- Stat 3 -->
                    <div class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="stat-icon" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg>
                        <span class="stat-number">120.000+</span>
                        <span class="stat-label">Khách hàng tin tưởng</span>
                    </div>
                    <!-- Stat 4 -->
                    <div class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="stat-icon" aria-hidden="true"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"></path><path d="M12 22V12"></path><polyline points="3.29 7 12 12 20.71 7"></polyline><path d="m7.5 4.27 9 5.15"></path></svg>
                        <span class="stat-number">210.000+</span>
                        <span class="stat-label">Đơn hàng đã giao</span>
                    </div>
                    <!-- Stat 5 -->
                    <div class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="stat-icon" aria-hidden="true"><path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5"></path><path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244"></path><path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05"></path></svg>
                        <span class="stat-number">5+</span>
                        <span class="stat-label">Kênh bán hàng đa dạng</span>
                    </div>
                    <!-- Stat 6 -->
                    <div class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="stat-icon" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                        <span class="stat-number">7 ngày</span>
                        <span class="stat-label">Đổi trả dễ dàng</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/about.js"></script>
</body>

</html>
